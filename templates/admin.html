<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{header.name}} - Resume</title>
    {{> head_assets.html}}
</head>
<body class="pb-20 bg-dark text-white relative">

{{> nav.html}}
        <div class="flex items-center">
            <a href="/" class="text-blue-500 hover:text-blue-400 font-medium text-sm border border-blue-500 px-3 py-1 rounded transition">Exit</a>
        </div>
    </div>
</nav>

<main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
    <h1 class="text-3xl font-bold text-white mb-8">Content Management</h1>

    <!-- Powiadomienia -->
    <div id="notification" class="hidden mb-6 p-4 rounded-lg text-white font-medium z-10 relative"></div>

    <div class="grid md:grid-cols-2 gap-8">
        <!-- Kolumna Projektów -->
        <div>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-white">Manage Projects</h2>
                <button onclick="prepareProjectForm()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm text-center font-medium transition">+ New</button>
            </div>

            <div id="project-form-container" class="card mb-6 hidden border-blue-900 border-2 p-4 rounded-lg bg-gray-900">
                <h3 class="text-lg font-bold mb-4 text-white" id="project-form-title">Add Project</h3>
                <input type="hidden" id="project-id">
                <input type="text" id="project-title" class="form-input w-full mb-3 p-2 rounded bg-gray-800 border border-gray-700 text-white outline-none focus:border-blue-500" placeholder="Title">
                <textarea id="project-description" class="form-input w-full mb-3 p-2 rounded bg-gray-800 border border-gray-700 text-white h-24 outline-none focus:border-blue-500" placeholder="Description"></textarea>
                <input type="text" id="project-github" class="form-input w-full mb-3 p-2 rounded bg-gray-800 border border-gray-700 text-white outline-none focus:border-blue-500" placeholder="GitHub URL">
                <input type="text" id="project-tech" class="form-input w-full mb-4 p-2 rounded bg-gray-800 border border-gray-700 text-white outline-none focus:border-blue-500" placeholder="Technologies (comma separated)">

                <div class="flex gap-2">
                    <button onclick="saveProject()" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-medium transition">Save</button>
                    <button id="project-delete-btn" onclick="deleteProject()" class="hidden bg-red-600 hover:bg-red-700 text-white px-4 rounded-lg font-medium transition">Delete</button>
                    <button onclick="hideProjectForm()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 rounded-lg font-medium transition">Cancel</button>
                </div>
            </div>

            <div id="projects-list" class="flex flex-col gap-4">
                <!-- Projekty wstrzykiwane przez JS -->
            </div>
        </div>

        <!-- Kolumna Doświadczenia -->
        <div>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-white">Manage Experience</h2>
                <button onclick="prepareExperienceForm()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm font-medium transition">+ New</button>
            </div>

            <div id="experience-form-container" class="card mb-6 hidden border-blue-900 border-2 p-4 rounded-lg bg-gray-900">
                <h3 class="text-lg font-bold mb-4 text-white" id="experience-form-title">Add Experience</h3>
                <input type="hidden" id="experience-id">
                <input type="text" id="experience-title" class="form-input w-full mb-3 p-2 rounded bg-gray-800 border border-gray-700 text-white outline-none focus:border-blue-500" placeholder="Job Title">
                <input type="text" id="experience-company" class="form-input w-full mb-3 p-2 rounded bg-gray-800 border border-gray-700 text-white outline-none focus:border-blue-500" placeholder="Company">
                <input type="text" id="experience-dates" class="form-input w-full mb-3 p-2 rounded bg-gray-800 border border-gray-700 text-white outline-none focus:border-blue-500" placeholder="Dates (e.g. Oct 2021 - Present)">
                <textarea id="experience-description" class="form-input w-full mb-4 p-2 rounded bg-gray-800 border border-gray-700 text-white h-24 outline-none focus:border-blue-500" placeholder="Description"></textarea>

                <div class="flex gap-2">
                    <button onclick="saveExperience()" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-medium transition">Save</button>
                    <button id="experience-delete-btn" onclick="deleteExperience()" class="hidden bg-red-600 hover:bg-red-700 text-white px-4 rounded-lg font-medium transition">Delete</button>
                    <button onclick="hideExperienceForm()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 rounded-lg font-medium transition">Cancel</button>
                </div>
            </div>

            <div id="experience-list" class="flex flex-col gap-4">
                <!-- Doświadczenie wstrzykiwane przez JS -->
            </div>
        </div>
    </div>
</main>

<!-- Modal na hasło (Popup) -->
<div id="password-modal" class="fixed inset-0 bg-black bg-opacity-60 hidden items-center justify-center z-50">
    <div class="bg-card border border-gray-700 p-6 rounded-lg shadow-xl w-full max-w-sm">
        <h3 class="text-xl font-bold text-white mb-4">Enter Admin Password</h3>
        <input type="password" id="modal-password" class="w-full bg-gray-800 border border-gray-700 text-white px-3 py-2 rounded outline-none focus:border-blue-500 mb-5" placeholder="Password...">
        <div class="flex justify-end gap-3">
            <button onclick="cancelPassword()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded font-medium transition">Cancel</button>
            <button onclick="confirmPassword()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-medium transition">Confirm</button>
        </div>
    </div>
</div>

<script>
    let siteData = { projects: [], experience: [] };
    let passwordResolve = null;

    function escapeHTML(str) {
        if (!str) return '';
        return str.toString().replace(/[&<>'"]/g, tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        }[tag] || tag));
    }

    async function loadData() {
        try {
            const res = await fetch('/api/get_data');
            if (res.ok) {
                siteData = await res.json();
                renderProjects();
                renderExperience();
            } else {
                showNotification('Failed to load data', 'red');
            }
        } catch (e) {
            showNotification('Server connection error', 'red');
        }
    }

    function showNotification(msg, color) {
        const noti = document.getElementById('notification');
        noti.textContent = msg;
        const bgClass = color === 'red' ? 'bg-red-600' : 'bg-green-600';
        noti.className = `mb-6 p-4 rounded-lg text-white font-medium ${bgClass} block z-10 relative`;

        window.scrollTo({top: 0, behavior: 'smooth'});
        setTimeout(() => { noti.className = 'hidden'; }, 3000);
    }

    /* Logika Popupu (Modala) dla hasła */
    function askForPassword() {
        return new Promise((resolve) => {
            const modal = document.getElementById('password-modal');
            const input = document.getElementById('modal-password');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            input.value = '';
            input.focus();
            passwordResolve = resolve;
        });
    }

    function closePasswordModal() {
        const modal = document.getElementById('password-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }

    function confirmPassword() {
        const pwd = document.getElementById('modal-password').value;
        if (!pwd) {
            alert('Password cannot be empty!');
            return;
        }
        closePasswordModal();
        if (passwordResolve) {
            passwordResolve(pwd);
            passwordResolve = null;
        }
    }

    function cancelPassword() {
        closePasswordModal();
        if (passwordResolve) {
            passwordResolve(null);
            passwordResolve = null;
        }
    }

    document.getElementById('modal-password').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            confirmPassword();
        }
    });

    /* Projects Logic */
    function renderProjects() {
        const container = document.getElementById('projects-list');
        container.innerHTML = '';
        if(!siteData.projects) return;
        siteData.projects.forEach(p => {
            container.innerHTML += `
                <div class="bg-card border border-gray-800 rounded-lg p-4 hover:border-gray-500 transition cursor-pointer" onclick="editProject(${p.id})">
                    <h4 class="font-bold text-white text-lg">${escapeHTML(p.title)}</h4>
                    <p class="text-sm text-gray-400 mt-1 truncate">${escapeHTML(p.description)}</p>
                </div>
            `;
        });
    }

    function prepareProjectForm() {
        const formContainer = document.getElementById('project-form-container');
        const formTitle = document.getElementById('project-form-title').innerText;

        if (!formContainer.classList.contains('hidden') && formTitle === "Add Project") {
            hideProjectForm();
            return;
        }

        document.getElementById('project-form-title').innerText = "Add Project";
        document.getElementById('project-id').value = '';
        document.getElementById('project-title').value = '';
        document.getElementById('project-description').value = '';
        document.getElementById('project-github').value = '';
        document.getElementById('project-tech').value = '';

        // Ukryj przycisk Delete
        document.getElementById('project-delete-btn').classList.add('hidden');

        formContainer.classList.remove('hidden');
    }

    function editProject(id) {
        const p = siteData.projects.find(proj => proj.id === id);
        if(!p) return;

        const formContainer = document.getElementById('project-form-container');
        const currentId = document.getElementById('project-id').value;
        const formTitle = document.getElementById('project-form-title').innerText;

        if (!formContainer.classList.contains('hidden') && currentId == p.id && formTitle === "Edit Project") {
            hideProjectForm();
            return;
        }

        document.getElementById('project-form-title').innerText = "Edit Project";
        document.getElementById('project-id').value = p.id;
        document.getElementById('project-title').value = p.title || '';
        document.getElementById('project-description').value = p.description || '';
        document.getElementById('project-github').value = p.githubUrl || '';
        document.getElementById('project-tech').value = (p.technologies || []).join(', ');

        // Pokaż przycisk Delete
        document.getElementById('project-delete-btn').classList.remove('hidden');

        formContainer.classList.remove('hidden');
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function hideProjectForm() { document.getElementById('project-form-container').classList.add('hidden'); }

    async function saveProject() {
        const pwd = await askForPassword();
        if(!pwd) return;

        const payload = {
            password: pwd,
            title: document.getElementById('project-title').value,
            description: document.getElementById('project-description').value,
            githubUrl: document.getElementById('project-github').value,
            technologies: document.getElementById('project-tech').value
        };
        const id = document.getElementById('project-id').value;
        if(id) payload.id = parseInt(id);

        try {
            const res = await fetch('/api/save_project', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if(res.ok) {
                showNotification('Project saved successfully!', 'green');
                hideProjectForm();
                loadData();
            } else {
                showNotification('Error saving project. Check password.', 'red');
            }
        } catch(e) { showNotification('Request failed', 'red'); }
    }

    async function deleteProject() {
        if (!confirm("Are you sure you want to delete this project? This action cannot be undone.")) return;

        const id = document.getElementById('project-id').value;
        if (!id) return;

        const pwd = await askForPassword();
        if (!pwd) return;

        try {
            const res = await fetch('/api/delete_project', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: parseInt(id), password: pwd })
            });
            if(res.ok) {
                showNotification('Project deleted successfully!', 'green');
                hideProjectForm();
                loadData();
            } else {
                showNotification('Error deleting project. Check password.', 'red');
            }
        } catch(e) { showNotification('Request failed', 'red'); }
    }

    /* Experience Logic */
    function renderExperience() {
        const container = document.getElementById('experience-list');
        container.innerHTML = '';
        if(!siteData.experience) return;
        siteData.experience.forEach(e => {
            container.innerHTML += `
                <div class="bg-card border border-gray-800 rounded-lg p-4 hover:border-gray-500 transition cursor-pointer" onclick="editExperience(${e.id})">
                    <h4 class="font-bold text-white text-lg">${escapeHTML(e.title)}</h4>
                    <p class="text-sm text-gray-400 mt-1">${escapeHTML(e.company)} (${escapeHTML(e.dates)})</p>
                </div>
            `;
        });
    }

    function prepareExperienceForm() {
        const formContainer = document.getElementById('experience-form-container');
        const formTitle = document.getElementById('experience-form-title').innerText;

        if (!formContainer.classList.contains('hidden') && formTitle === "Add Experience") {
            hideExperienceForm();
            return;
        }

        document.getElementById('experience-form-title').innerText = "Add Experience";
        document.getElementById('experience-id').value = '';
        document.getElementById('experience-title').value = '';
        document.getElementById('experience-company').value = '';
        document.getElementById('experience-dates').value = '';
        document.getElementById('experience-description').value = '';

        // Ukryj przycisk Delete
        document.getElementById('experience-delete-btn').classList.add('hidden');

        formContainer.classList.remove('hidden');
    }

    function editExperience(id) {
        const e = siteData.experience.find(exp => exp.id === id);
        if(!e) return;

        const formContainer = document.getElementById('experience-form-container');
        const currentId = document.getElementById('experience-id').value;
        const formTitle = document.getElementById('experience-form-title').innerText;

        if (!formContainer.classList.contains('hidden') && currentId == e.id && formTitle === "Edit Experience") {
            hideExperienceForm();
            return;
        }

        document.getElementById('experience-form-title').innerText = "Edit Experience";
        document.getElementById('experience-id').value = e.id;
        document.getElementById('experience-title').value = e.title || '';
        document.getElementById('experience-company').value = e.company || '';
        document.getElementById('experience-dates').value = e.dates || '';
        document.getElementById('experience-description').value = e.description || '';

        // Pokaż przycisk Delete
        document.getElementById('experience-delete-btn').classList.remove('hidden');

        formContainer.classList.remove('hidden');
    }

    function hideExperienceForm() { document.getElementById('experience-form-container').classList.add('hidden'); }

    async function saveExperience() {
        const pwd = await askForPassword();
        if(!pwd) return;

        const payload = {
            password: pwd,
            title: document.getElementById('experience-title').value,
            company: document.getElementById('experience-company').value,
            dates: document.getElementById('experience-dates').value,
            description: document.getElementById('experience-description').value
        };
        const id = document.getElementById('experience-id').value;
        if(id) payload.id = parseInt(id);

        try {
            const res = await fetch('/api/save_experience', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if(res.ok) {
                showNotification('Experience saved successfully!', 'green');
                hideExperienceForm();
                loadData();
            } else {
                showNotification('Error saving experience. Check password.', 'red');
            }
        } catch(e) { showNotification('Request failed', 'red'); }
    }

    async function deleteExperience() {
        if (!confirm("Are you sure you want to delete this experience? This action cannot be undone.")) return;

        const id = document.getElementById('experience-id').value;
        if (!id) return;

        const pwd = await askForPassword();
        if (!pwd) return;

        try {
            const res = await fetch('/api/delete_experience', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: parseInt(id), password: pwd })
            });
            if(res.ok) {
                showNotification('Experience deleted successfully!', 'green');
                hideExperienceForm();
                loadData();
            } else {
                showNotification('Error deleting experience. Check password.', 'red');
            }
        } catch(e) { showNotification('Request failed', 'red'); }
    }

    // Init
    window.onload = loadData;
</script>
</body>
</html>
