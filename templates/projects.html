<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{header.name}} - Resume</title>
    {{> head_assets.html}}
</head>
<body class="bg-dark text-white pb-20 relative">

{{> nav.html}}

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 mb-12">
    <div class="mb-12">
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-4 tracking-tight">
            My Projects
        </h1>
        <p class="text-lg text-gray-400">
            A collection of my personal projects
        </p>
    </div>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
        {{#projects}}
        <div class="bg-card rounded-2xl shadow-lg border border-gray-800 p-6 flex flex-col hover-card">
            <h3 class="text-xl font-bold text-white mb-3">{{title}}</h3>
            <p class="text-gray-400 mb-5 leading-relaxed flex-1 text-sm">{{description}}</p>
            <div class="flex flex-wrap gap-2 mb-6">
                {{#technologies}}
                <span class="px-3 py-1 bg-gray-800 bg-opacity-50 text-gray-300 rounded-lg text-xs font-semibold border border-gray-700">{{name}}</span>
                {{/technologies}}
            </div>
            <div class="pt-4 border-t border-gray-800 mt-auto flex gap-4">
                <a href="/project/{{id}}" class="text-blue-400 hover:text-blue-300 font-medium inline-flex items-center gap-1 transition">
                    Details <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </a>
                <a href="{{githubUrl}}" target="_blank" rel="noopener noreferrer" class="text-gray-400 hover:text-white font-medium inline-flex items-center gap-1 transition ml-auto">
                    <i data-lucide="github" class="w-4 h-4"></i> View Source
                </a>
            </div>
        </div>
        {{/projects}}
    </div>
</main>

<script>
    lucide.createIcons();
</script>
</body>
</html>
